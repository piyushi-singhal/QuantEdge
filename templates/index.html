<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum-Inspired Tokenization</title>
    <link href="/static/css/styles.css?v=2" rel="stylesheet">
    <style>
        .risk-critical { color: #dc2626; font-weight: 600; }
        .risk-high { color: #ea580c; font-weight: 600; }
        .risk-medium { color: #ca8a04; font-weight: 600; }
        .risk-low { color: #16a34a; font-weight: 600; }
        .blockchain-hash { font-family: monospace; font-size: 0.75rem; color: #6b7280; word-break: break-all; }
        .expiry-warning { color: #dc2626; font-size: 0.8rem; }
        .expiry-ok { color: #16a34a; font-size: 0.8rem; }
        .token-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .detail-card { background: #f9fafb; border-radius: 8px; padding: 0.75rem; margin-bottom: 0.5rem; border-left: 3px solid #d1d5db; }
        .detail-card.high-risk { border-left-color: #dc2626; }
        .detail-card.med-risk { border-left-color: #ca8a04; }
        .detail-card.low-risk { border-left-color: #16a34a; }
        .detail-label { font-size: 0.7rem; text-transform: uppercase; color: #9ca3af; letter-spacing: 0.05em; }
        .detail-value { font-size: 0.85rem; color: #1f2937; margin-top: 2px; font-family: monospace; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 0.7rem; font-weight: 500; }
        .badge-critical { background: #fef2f2; color: #dc2626; }
        .badge-high { background: #fff7ed; color: #ea580c; }
        .badge-medium { background: #fefce8; color: #a16207; }
        .badge-low { background: #f0fdf4; color: #16a34a; }
        .status-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
        .status-active { background: #16a34a; }
        .status-expiring { background: #ea580c; }
        .status-revoked { background: #dc2626; }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="header-content">
                <h1>Quantum-Inspired Tokenization</h1>
                <div class="user-controls">
                    <span class="username">{{ user.username }}</span>
                    <a href="/logout" class="logout-btn">Logout</a>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="message" class="message-container"></div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-label">Total Records Processed</div>
                <div class="stat-number" id="totalRecords">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Tokens</div>
                <div class="stat-number" id="activeTokens">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Fields Tokenized</div>
                <div class="stat-number" id="fieldsTokenized">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Blockchain Txns</div>
                <div class="stat-number" id="blockchainTxns">0</div>
            </div>
        </div>

        <div class="section-container">
            <div class="section">
                <h2>Token Vault</h2>
                <div class="field-tabs" id="fieldTabs"></div>
                <div id="tokenVault">
                    <div class="empty-state"><div class="empty-icon">&#x1F512;</div><div class="empty-text">Select a field to view token details</div></div>
                </div>
            </div>

            <div class="section">
                <h2>Recent Files</h2>
                <div class="files-grid" id="recentFiles"></div>
            </div>
        </div>

        <div class="section" style="margin-top: 2rem;">
            <h2>Blockchain Ledger</h2>
            <div id="blockchainLedger" style="max-height: 300px; overflow-y: auto;">
                <div class="empty-state"><div class="empty-icon">&#x26A1;</div><div class="empty-text">Loading blockchain records...</div></div>
            </div>
        </div>
    </div>

    <script>
        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showMessage(message, type) {
            type = type || 'error';
            var messageDiv = document.getElementById('message');
            var alert = document.createElement('div');
            alert.className = 'alert alert-' + type + ' fade-in';
            alert.textContent = message;
            messageDiv.innerHTML = '';
            messageDiv.appendChild(alert);
            setTimeout(function () {
                alert.classList.add('fade-out');
                setTimeout(function () { if (alert.parentNode) messageDiv.removeChild(alert); }, 500);
            }, 4500);
        }

        function riskBadge(score) {
            if (score >= 80) return '<span class="badge badge-critical">Critical</span>';
            if (score >= 50) return '<span class="badge badge-high">High</span>';
            if (score >= 25) return '<span class="badge badge-medium">Medium</span>';
            return '<span class="badge badge-low">Low</span>';
        }

        function expiryStatus(expiresAt) {
            if (!expiresAt) return '<span class="status-indicator status-active"></span>Permanent';
            var now = Date.now();
            var expiry = new Date(expiresAt).getTime();
            var diffMin = (expiry - now) / 60000;
            if (diffMin <= 0) return '<span class="status-indicator status-revoked"></span>Expired';
            if (diffMin < 5) return '<span class="status-indicator status-expiring"></span>Expiring (' + Math.round(diffMin) + 'm)';
            return '<span class="status-indicator status-active"></span>Active';
        }

        function buildTokenDetailCard(m, idx) {
            var riskClass = m.risk_score >= 80 ? 'high-risk' : (m.risk_score >= 50 ? 'med-risk' : 'low-risk');
            var txShort = m.blockchain_tx_hash ? m.blockchain_tx_hash.substring(0, 16) + '...' : 'N/A';
            var expiresStr = m.expires_at ? new Date(m.expires_at).toLocaleString() : 'Permanent';
            return '<div class="detail-card ' + riskClass + '">'
                + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">'
                + '<strong style="font-size:0.85rem;">' + escapeHtml(m.original_truncated || m.original) + '</strong>'
                + riskBadge(m.risk_score)
                + '</div>'
                + '<div class="token-detail-grid">'
                + '<div><div class="detail-label">Token A</div><div class="detail-value">' + escapeHtml(m.token_a) + '</div></div>'
                + '<div><div class="detail-label">Token B</div><div class="detail-value">' + escapeHtml(m.token_b || 'N/A') + '</div></div>'
                + '<div><div class="detail-label">Risk Score</div><div class="detail-value"><span class="risk-' + (m.risk_score >= 80 ? 'critical' : m.risk_score >= 50 ? 'high' : m.risk_score >= 25 ? 'medium' : 'low') + '">' + m.risk_score + '/100</span></div></div>'
                + '<div><div class="detail-label">Expiry</div><div class="detail-value">' + expiresStr + '</div></div>'
                + '<div style="grid-column:1/3;"><div class="detail-label">Blockchain TX</div><div class="blockchain-hash">' + escapeHtml(m.blockchain_tx_hash || 'Not on chain') + '</div></div>'
                + '<div style="grid-column:1/3;"><div class="detail-label">Status</div><div class="detail-value">' + expiryStatus(m.expires_at) + (m.is_revoked ? ' (Revoked)' : '') + '</div></div>'
                + '</div>'
                + '<div style="margin-top:6px;font-size:0.7rem;color:#9ca3af;">Token ID: ' + m.id + ' | Dept: ' + escapeHtml(m.source_dept) + ' → ' + escapeHtml(m.dest_dept) + '</div>'
                + '</div>';
        }

        function loadTokenVault(field, mappings) {
            var vault = document.getElementById('tokenVault');
            if (!mappings || Object.keys(mappings).length === 0) {
                vault.innerHTML = '<div class="empty-state"><div class="empty-icon">&#x1F512;</div><div class="empty-text">No tokens for ' + escapeHtml(field) + '</div></div>';
                return;
            }
            var sorted = Object.entries(mappings).sort(function (a, b) { return a[0].localeCompare(b[0]); });
            var html = '<div style="max-height:400px;overflow-y:auto;">';
            for (var i = 0; i < sorted.length; i++) {
                html += buildTokenDetailCard(sorted[i][1], i);
            }
            html += '</div>';
            vault.innerHTML = html;
        }

        async function updateData() {
            try {
                var statsResponse = await fetch('/stats');
                if (!statsResponse.ok) throw new Error('Failed to fetch stats');
                var stats = await statsResponse.json();

                document.getElementById('totalRecords').textContent = stats.total_records || 0;
                document.getElementById('activeTokens').textContent = stats.active_tokens || 0;
                document.getElementById('fieldsTokenized').textContent = Object.keys(stats.field_stats || {}).length;

                var recentFilesDiv = document.getElementById('recentFiles');
                if (stats.recent_files && stats.recent_files.length > 0) {
                    var filesHtml = '';
                    for (var i = 0; i < stats.recent_files.length; i++) {
                        var file = stats.recent_files[i];
                        filesHtml += '<div class="file-card ' + file.status.toLowerCase() + '">'
                            + '<div class="file-name">' + escapeHtml(file.filename) + '</div>'
                            + '<div class="file-stats"><span>Records: ' + file.records + '</span><span>Status: ' + escapeHtml(file.status) + '</span></div>'
                            + '<div class="file-time">' + escapeHtml(new Date(file.processed_at).toLocaleString()) + '</div>'
                            + '</div>';
                    }
                    recentFilesDiv.innerHTML = filesHtml;
                } else {
                    recentFilesDiv.innerHTML = '<div class="empty-state"><div class="empty-icon">&#x1F4C1;</div><div class="empty-text">No files processed yet</div></div>';
                }

                var fieldTabs = document.getElementById('fieldTabs');
                var mappings = stats.token_mappings || {};
                var fields = Object.keys(mappings);

                if (fields.length > 0) {
                    var activeField = localStorage.getItem('activeField') || fields[0];
                    if (fields.indexOf(activeField) === -1) activeField = fields[0];
                    var tabsHtml = '';
                    for (var i = 0; i < fields.length; i++) {
                        var f = fields[i];
                        tabsHtml += '<div class="field-tab' + (f === activeField ? ' active' : '') + '" data-field="' + escapeHtml(f) + '">' + escapeHtml(f) + '</div>';
                    }
                    fieldTabs.innerHTML = tabsHtml;
                    var tabElements = fieldTabs.querySelectorAll('.field-tab');
                    for (var i = 0; i < tabElements.length; i++) {
                        (function (field) {
                            tabElements[i].addEventListener('click', function () {
                                loadTokenVault(field, mappings[field]);
                            });
                        })(fields[i]);
                    }
                    loadTokenVault(activeField, mappings[activeField]);
                } else {
                    fieldTabs.innerHTML = '';
                    document.getElementById('tokenVault').innerHTML = '<div class="empty-state"><div class="empty-icon">&#x1F512;</div><div class="empty-text">No mappings available</div></div>';
                }
            } catch (error) {
                console.error('Error updating data:', error);
                showMessage('Failed to update data.');
            }
        }

        async function loadBlockchainLedger() {
            try {
                var resp = await fetch('/token-mappings');
                if (!resp.ok) return;
                var mappings = await resp.json();
                var ledger = document.getElementById('blockchainLedger');
                if (!mappings || mappings.length === 0) {
                    ledger.innerHTML = '<div class="empty-state"><div class="empty-icon">&#x26A1;</div><div class="empty-text">No blockchain records yet</div></div>';
                    return;
                }
                document.getElementById('blockchainTxns').textContent = mappings.length;

                var html = '<table style="width:100%;border-collapse:collapse;font-size:0.8rem;">'
                    + '<thead><tr style="background:#f3f4f6;">'
                    + '<th style="padding:8px;text-align:left;">Field</th>'
                    + '<th style="padding:8px;text-align:left;">Value</th>'
                    + '<th style="padding:8px;text-align:center;">Risk</th>'
                    + '<th style="padding:8px;text-align:left;">TX Hash</th>'
                    + '<th style="padding:8px;text-align:center;">Status</th>'
                    + '</tr></thead><tbody>';
                for (var i = 0; i < Math.min(mappings.length, 20); i++) {
                    var m = mappings[i];
                    var riskClass = m.risk_score >= 80 ? 'risk-critical' : (m.risk_score >= 50 ? 'risk-high' : (m.risk_score >= 25 ? 'risk-medium' : 'risk-low'));
                    html += '<tr style="border-bottom:1px solid #e5e7eb;">'
                        + '<td style="padding:8px;">' + escapeHtml(m.field) + '</td>'
                        + '<td style="padding:8px;max-width:120px;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(m.original_truncated || '').substring(0, 25) + '</td>'
                        + '<td style="padding:8px;text-align:center;"><span class="' + riskClass + '">' + m.risk_score + '</span></td>'
                        + '<td style="padding:8px;font-family:monospace;font-size:0.7rem;">' + (m.blockchain_tx_hash ? escapeHtml(m.blockchain_tx_hash).substring(0, 12) + '...' : '-') + '</td>'
                        + '<td style="padding:8px;text-align:center;">' + (m.is_revoked ? '<span style="color:#dc2626;">Revoked</span>' : (m.expires_at && new Date(m.expires_at).getTime() < Date.now() ? '<span style="color:#dc2626;">Expired</span>' : '<span style="color:#16a34a;">Active</span>')) + '</td>'
                        + '</tr>';
                }
                html += '</tbody></table>';
                ledger.innerHTML = html;
            } catch (e) {
                console.error('Blockchain ledger error:', e);
            }
        }

        updateData();
        loadBlockchainLedger();
        setInterval(function () { updateData(); loadBlockchainLedger(); }, 10000);
    </script>
</body>
</html>
